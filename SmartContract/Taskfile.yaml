version: '3'
tasks:
  clean:
    cmd: cargo clean

  fmt:
    cmd: cargo fmt --all

  check:
    cmd: cargo check --workspace

  build:
    cmds:
      - cargo build --release --target wasm32v1-none --workspace
      - mkdir -p contracts
      - |
        find target/wasm32v1-none/release -maxdepth 1 -type f -name "*.wasm" \
          -exec soroban contract optimize --wasm {} --wasm-out contracts/$(basename {}) \;
      - ls -l contracts/*.wasm

  test:
    cmd: cargo test --workspace

  default:
    cmds:
      - task: build

  all:
    cmds:
      - task: clean
      - task: fmt
      - task: build
      - task: check
      - task: test