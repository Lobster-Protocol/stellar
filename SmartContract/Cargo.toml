[workspace]
members = [
    "lobster",
    "packages/decimal",
    "factory",

]
resolver = "2"

[workspace.package]
version = "1.7.0"
rust-version = "1.87"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/"

# Add this profile section
[profile.release]
overflow-checks = true

[profile.dev]
overflow-checks = true


[workspace.dependencies]
soroban-sdk = { version = "22.0.6" }
soroban-token-sdk = { version = "22.0.6" }
soroban-fixed-point-math = { version = "1.3.0" }
paste = { version = "1.0.15" }
