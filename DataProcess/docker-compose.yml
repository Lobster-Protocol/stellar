version: "3.9"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lobster
      MINIO_ROOT_PASSWORD: lobster-secret-123
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - /home/esteban/Desktop/Lobster/.volumes/minio:/data

  data-api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npx ts-node src/api.ts"
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: lobster
      S3_SECRET_KEY: lobster-secret-123
      S3_BUCKET: lobster
      S3_OVERWRITE: '1'
      # Ensure GraphQL points to your SubQuery endpoint
      SUBQUERY_URL: http://host.docker.internal:3000
    volumes:
      - /home/esteban/Desktop/Lobster/DataProcess:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio
      - minio-init

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh","-c"]
    command: >
      "
      set -e;
      until mc alias set local http://minio:9000 lobster lobster-secret-123 >/dev/null 2>&1; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb -p local/lobster || true;
      mc anonymous set download local/lobster || true;
      echo 'MinIO bucket lobster is ready.';
      "
